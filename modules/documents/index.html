<style>
.di-tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.di-tab {
  padding: 8px 20px; font-size: 13px; font-weight: 500; color: var(--ink-3);
  text-decoration: none; border-radius: var(--r-pill, 999px);
  transition: background .12s, color .12s;
}
.di-tab:hover { color: var(--ink); background: var(--surface-2); }
.di-tab.active { background: var(--terra); color: #fff; }

.di-card { background: #fff; border: var(--hair); border-radius: var(--r-card, 12px); overflow: hidden; }
.di-row {
  display: grid; grid-template-columns: 40px 1fr 140px 130px 110px 120px;
  align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: var(--hair); cursor: pointer;
  transition: background .12s;
}
.di-row:last-child { border-bottom: 0; }
.di-row:hover { background: var(--surface-2); }

.di-ext {
  width: 32px; height: 38px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 700; color: #fff; letter-spacing: 0.04em;
}
.di-ext.pdf  { background: #C44B4B; }
.di-ext.docx { background: #1E40AF; }
.di-ext.xlsx { background: #008978; }
.di-ext.zip  { background: #D4960A; }
.di-ext.png  { background: #7B4D9F; }

.di-title { font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; }
.di-sub   { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.di-meta  { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.di-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.di-badge.process   { background: var(--gold-soft); color: var(--gold); }
.di-badge.completed { background: var(--ok-soft); color: var(--ok); }
.di-badge.draft     { background: var(--surface-2); color: var(--ink-3); }
.di-badge.cancelled { background: var(--bad-soft); color: var(--bad); }
.di-badge.signed    { background: var(--ok-soft); color: var(--ok); }
.di-badge.needs     { background: var(--terra-soft); color: var(--terra); }
.di-badge.internal  { background: var(--info-soft); color: var(--info); }

.di-view-wrap { position: relative; }
.di-view-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; font-size: 12.5px; font-weight: 600;
  color: var(--terra); background: transparent;
  border: 1.5px solid var(--terra); border-radius: var(--r-input, 8px);
  cursor: pointer;
}
.di-view-btn:hover { background: var(--terra-soft); }
.di-view-btn svg { width: 11px; height: 11px; }
.di-dropdown {
  display: none; position: absolute; right: 0; top: calc(100% + 4px);
  min-width: 170px; background: #fff;
  border: var(--hair); border-radius: var(--r-card, 12px);
  box-shadow: 0 8px 24px -8px rgba(15,23,42,.18);
  z-index: 20; padding: 4px 0;
}
.di-dropdown.show { display: block; }
.di-dropdown a {
  display: block; padding: 8px 14px; font-size: 12.5px;
  color: var(--ink); cursor: pointer; text-decoration: none;
}
.di-dropdown a:hover { background: var(--surface-2); }
.di-dropdown a.danger { color: var(--bad); }

.di-empty {
  padding: 80px 20px; text-align: center; color: var(--ink-3);
}
.di-empty svg { width: 44px; height: 44px; margin-bottom: 10px; opacity: 0.4; }
.di-empty .t { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.di-empty .h { font-size: 12.5px; margin-top: 4px; }
.di-empty a { color: var(--terra); font-weight: 600; margin-top: 12px; display: inline-block; }

.di-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; gap: 8px; }
</style>

<script>
const INLINE_DOCS = ([

  { id:1035, ext:'pdf',  title:'Service contract — R. Chen (signed)',   to:'rebecca.chen@gmail.com',     date:'May 12, 2026', status:'completed', tabs:['all','completed'] },

  { id:1031, ext:'pdf',  title:'Quote — Linwood Plaza (declined)',      to:'pm@linwood.com',             date:'Apr 22, 2026', status:'cancelled', tabs:['all','cancelled'] },
  { id:1030, ext:'pdf',  title:'Quote — Cedar Glen HOA',                to:'board@cedarglen.com',        date:'Apr 15, 2026', status:'cancelled', tabs:['all','cancelled'] },

  { id:1029, ext:'pdf',  title:'Employee handbook v4.pdf',              to:'All staff',                  date:'Apr 01, 2026', status:'internal',  tabs:['all','internal'] },
  { id:1028, ext:'pdf',  title:'Workplace safety policy.pdf',           to:'All staff',                  date:'Mar 15, 2026', status:'internal',  tabs:['all','internal'] },
  { id:1027, ext:'xlsx', title:'Q1 P&L final.xlsx',                     to:'Finance team',               date:'Apr 01, 2026', status:'internal',  tabs:['all','internal'] },
  { id:1026, ext:'docx', title:'Vendor list 2026.docx',                 to:'Ops team',                   date:'Mar 02, 2026', status:'internal',  tabs:['all','internal'] },
  // Templates
  { id:2001, ext:'docx', title:'Standard service contract — template',   to:'Template · used 12×',         date:'Mar 01, 2026', status:'template',  tabs:['templates'] },
  { id:2002, ext:'docx', title:'Long-distance addendum — template',      to:'Template · used 5×',          date:'Feb 10, 2026', status:'template',  tabs:['templates'] },
  { id:2003, ext:'docx', title:'Packing services rider — template',      to:'Template · used 9×',          date:'Feb 04, 2026', status:'template',  tabs:['templates'] },
  { id:2004, ext:'docx', title:'Damage waiver — template',                to:'Template · used 31×',         date:'Jan 18, 2026', status:'template',  tabs:['templates'] },
  { id:2005, ext:'pdf',  title:'Storage rental agreement — template',    to:'Template · used 18×',         date:'Jan 12, 2026', status:'template',  tabs:['templates'] },
  // Field contracts (signed in field)
  { id:3001, ext:'pdf',  title:'Field contract — J. Park (signed)',       to:'jpark@gmail.com',             date:'May 18, 2026', status:'fieldsigned', tabs:['fieldcontracts'] },
  { id:3002, ext:'pdf',  title:'Field contract — D. Wu (signed)',         to:'david@example.com',           date:'May 16, 2026', status:'fieldsigned', tabs:['fieldcontracts'] },
  { id:3003, ext:'pdf',  title:'Field contract — M. Tran (signed)',       to:'m.tran@outlook.com',          date:'May 14, 2026', status:'fieldsigned', tabs:['fieldcontracts'] },
  { id:3004, ext:'pdf',  title:'Field damage report — Truck 02',          to:'Crew · Ravi Patel',           date:'May 09, 2026', status:'fieldsigned', tabs:['fieldcontracts'] }
]);

const BADGE_LBL = { process:'In process', completed:'Completed', draft:'Draft', cancelled:'Cancelled', needs:'Needs your signature', internal:'Internal', template:'Template', fieldsigned:'Field signed' };

// Read fresh on every render so host state-pushes land. Backend BuildS1State
// emits a `docs[]` array matching this reader's exact field names
// (id, ext, title, to, date, status, statusLabel, statusClass, tabs). When
// the backend is offline (no fixtures available and not on prod) fall back
// to the bundled INLINE_DOCS so devs see something.
function getDocs() {
  const IS_PROD = /(^|\.)service1\.app$/i.test(location.hostname);
  const state = (window.S1 && window.S1.fixtures && window.S1.fixtures["documents"]) || null;
  const raw = (state && Array.isArray(state.docs) && state.docs.length)
    ? state.docs
    : (IS_PROD ? [] : INLINE_DOCS);
  return raw.map(d => {
    // Ensure `tabs` is always an array so .includes() works even if the
    // backend ships a single status string instead of the tab list.
    let tabs = d.tabs;
    if (!Array.isArray(tabs)) {
      tabs = d.status ? ['all', d.status] : ['all'];
    }
    // Status label/class come from server. Fall back to local lookup only
    // when binding-gap demo data is used.
    const statusLabel = d.statusLabel || BADGE_LBL[d.status] || d.status || '';
    const statusClass = d.statusClass || ('di-badge ' + (d.status || ''));
    const extClass    = d.extClass    || ('di-ext ' + (d.ext || ''));
    return Object.assign({}, d, { tabs, statusLabel, statusClass, extClass });
  });
}

function svgNS(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function el(tag, opts, children) {
  const e = document.createElement(tag);
  if (opts) {
    if (opts.className) e.className = opts.className;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.style) e.style.cssText = opts.style;
    if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  }
  if (children) for (const c of children) if (c != null) e.appendChild(c);
  return e;
}

function buildEmpty() {
  const wrap = el('div', { className: 'di-empty' });
  const svg = svgNS('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  svg.appendChild(svgNS('path', { d: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' }));
  svg.appendChild(svgNS('polyline', { points: '14 2 14 8 20 8' }));
  wrap.appendChild(svg);
  wrap.appendChild(el('div', { className: 't', text: 'No documents in this view' }));
  wrap.appendChild(el('div', { className: 'h', text: 'Documents you create or receive will appear here.' }));
  wrap.appendChild(el('a', { attrs: { href: '#' }, text: '+ New document' }));
  return wrap;
}

function buildRow(d) {
  const row = el('div', { className: 'di-row', attrs: { 'data-id': String(d.id) } });
  row.appendChild(el('div', { className: d.extClass, text: (d.ext || '').toUpperCase() }));
  const mid = el('div');
  mid.appendChild(el('div', { className: 'di-title', text: d.title }));
  mid.appendChild(el('div', { className: 'di-sub', text: 'To: ' + d.to }));
  row.appendChild(mid);
  row.appendChild(el('div', { className: 'di-meta', text: d.date }));
  const statusWrap = el('div');
  statusWrap.appendChild(el('span', { className: d.statusClass, text: d.statusLabel }));
  row.appendChild(statusWrap);
  row.appendChild(el('div', { className: 'di-meta', style: 'font-size:11.5px;color:var(--ink-3);', text: '#' + d.id }));

  const viewWrap = el('div', { className: 'di-view-wrap' });
  const btn = el('button', { className: 'di-view-btn' });
  btn.appendChild(document.createTextNode('View '));
  const caret = svgNS('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2.4' });
  caret.appendChild(svgNS('polyline', { points: '6 9 12 15 18 9' }));
  btn.appendChild(caret);
  btn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleDd(btn); });
  viewWrap.appendChild(btn);

  const dd = el('div', { className: 'di-dropdown', attrs: { 'data-doc-id': String(d.id) } });
  dd.appendChild(el('a', { attrs: { href: '#' }, text: 'Open' }));
  dd.appendChild(el('a', { attrs: { 'data-comm-action': 'action:documents.download', href: '#' }, text: 'Download' }));
  dd.appendChild(el('a', { attrs: { 'data-comm-action': 'action:documents.send-copy', href: '#' }, text: 'Send copy' }));
  dd.appendChild(el('a', { attrs: { 'data-comm-action': 'action:documents.rename', href: '#' }, text: 'Rename' }));
  dd.appendChild(el('a', { className: 'danger', attrs: { 'data-comm-action': 'action:documents.delete', href: '#' }, text: 'Delete' }));
  viewWrap.appendChild(dd);
  row.appendChild(viewWrap);
  return row;
}

function render(tab) {
  const list = document.getElementById('diList');
  const shown = getDocs().filter(d => d.tabs.includes(tab));
  while (list.firstChild) list.removeChild(list.firstChild);
  if (!shown.length) {
    list.appendChild(buildEmpty());
    return;
  }
  for (const d of shown) list.appendChild(buildRow(d));
}

function toggleDd(btn) {
  const dd = btn.nextElementSibling;
  document.querySelectorAll('.di-dropdown.show').forEach(el => { if (el !== dd) el.classList.remove('show'); });
  dd.classList.toggle('show');
}
window.toggleDd = toggleDd;

document.addEventListener('click', e => {
  if (!e.target.closest('.di-view-wrap')) {
    document.querySelectorAll('.di-dropdown.show').forEach(el => el.classList.remove('show'));
  }
});

// Tab click — defer to data-tab handler in shared interactions.js, but render content
document.querySelectorAll('#diTabs .di-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('#diTabs .di-tab').forEach(x => x.classList.toggle('active', x === t));
  render(t.dataset.tab);
}));

// Row click → open detail modal
document.getElementById('diList').addEventListener('click', e => {
  if (e.target.closest('.di-view-wrap')) return;
  const row = e.target.closest('.di-row'); if (!row) return;
  const d = getDocs().find(x => x.id === +row.dataset.id); if (!d) return;
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;';
  const card = el('div', { style: 'background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 24px 60px -16px rgba(15,23,42,.4);' });
  const head = el('div', { style: 'padding:22px 26px 16px;border-bottom:var(--hair);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;' });
  const headL = el('div', { style: 'display:flex;gap:14px;align-items:flex-start;' });
  headL.appendChild(el('div', { className: d.extClass, style: 'width:42px;height:48px;font-size:11px;', text: (d.ext || '').toUpperCase() }));
  const info = el('div');
  info.appendChild(el('div', { style: 'font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;', text: 'Document · #' + d.id }));
  info.appendChild(el('h2', { style: 'margin:6px 0 8px;font-size:20px;font-weight:700;letter-spacing:-0.01em;', text: d.title }));
  info.appendChild(el('span', { className: d.statusClass, text: d.statusLabel }));
  headL.appendChild(info);
  head.appendChild(headL);
  head.appendChild(el('button', { className: 'x', style: 'border:0;background:transparent;font-size:24px;color:var(--ink-3);cursor:pointer;line-height:1;', text: '×' }));
  card.appendChild(head);

  const body = el('div', { style: 'padding:18px 26px;' });
  const grid = el('div', { style: 'display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;' });
  const to = el('div', { style: 'padding:10px 14px;border:var(--hair);border-radius:8px;' });
  to.appendChild(el('div', { style: 'font-size:11px;color:var(--ink-3);', text: 'To' }));
  to.appendChild(el('div', { style: 'font-weight:600;margin-top:4px;', text: d.to }));
  grid.appendChild(to);
  const dt = el('div', { style: 'padding:10px 14px;border:var(--hair);border-radius:8px;' });
  dt.appendChild(el('div', { style: 'font-size:11px;color:var(--ink-3);', text: 'Date' }));
  dt.appendChild(el('div', { style: 'font-weight:600;margin-top:4px;', text: d.date }));
  grid.appendChild(dt);
  body.appendChild(grid);

  const actions = el('div', { style: 'display:flex;justify-content:flex-end;gap:8px;' });
  actions.appendChild(el('button', { className: 'btn btn-secondary x', text: 'Close' }));
  actions.appendChild(el('button', { className: 'btn btn-secondary', attrs: { 'data-comm-action': 'action:documents.download' }, text: 'Download' }));
  actions.appendChild(el('button', { className: 'btn btn-primary', text: 'Open document →' }));
  body.appendChild(actions);
  card.appendChild(body);
  m.appendChild(card);
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('click', e2 => { if (e2.target === m) close(); });
  m.querySelectorAll('.x').forEach(b => b.addEventListener('click', close));
});

render('all');

// Re-render when the host pushes fresh state.
if (window.S1 && window.S1.bus && typeof window.S1.bus.on === 'function') {
  window.S1.bus.on('state:replaced', () => {
    const active = document.querySelector('#diTabs .di-tab.active');
    render(active ? active.dataset.tab : 'all');
  });
}
</script>
</body>
</html>
