<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Sales Dashboard</div></div>

  <section class="section">
    <h3 class="section-title">Pipeline</h3>
    <div class="cards" data-bind="pipeline">
      <template>
        <div class="card">
          <div class="section-sub">{{stage}}</div>
          <div style="font-size:24px;font-weight:600">{{deals|num}}</div>
          <div class="section-sub">{{value|usdint}}</div>
        </div>
      </template>
    </div>
  </section>

  <section class="section">
    <h3 class="section-title">Deals</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Customer</th><th>Stage</th><th style="text-align:right">Value</th><th>Owner</th><th>Updated</th></tr></thead>
      <tbody data-bind="deals">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{customer}}</td>
            <td>{{stage}}</td>
            <td style="text-align:right">{{value|usdint}}</td>
            <td>{{owner}}</td>
            <td>{{updated|date}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">Customers</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
      <tbody data-bind="customers">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{name}}</td>
            <td>{{email}}</td>
            <td>{{phone}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
