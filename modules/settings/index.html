<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
.nav-group { margin-bottom: 16px; }
.nav-group .title { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.nav-item { display: block; padding: 6px 10px; border-radius: var(--r); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--terra); color: #fff; }
.row { display: grid; grid-template-columns: 1fr 110px 110px 110px; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.row .hd { font-weight: 600; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Settings</div></div>

  <div class="layout">
    <aside>
      <div id="nav-host"></div>
    </aside>
    <main>
      <section class="section">
        <h3 class="section-title">Personal info</h3>
        <div class="field"><label>Full name</label><input id="f-name" type="text"></div>
        <div class="field"><label>Email</label><input id="f-email" type="email"></div>
        <div class="field"><label>Phone</label><input id="f-phone" type="tel"></div>
        <div class="field">
          <label>Role</label>
          <select id="f-role"></select>
        </div>
      </section>

      <section class="section">
        <h3 class="section-title">Workspace</h3>
        <div class="field"><label>Company</label><input id="f-company" type="text"></div>
        <div class="field">
          <label>Timezone</label>
          <select id="f-tz"></select>
        </div>
        <div class="field">
          <label>Language</label>
          <select id="f-lang"></select>
        </div>
        <div class="field"><label>Theme</label><input id="f-theme" type="text" readonly></div>
      </section>

      <section class="section">
        <h3 class="section-title">Notifications</h3>
        <div class="row hd"><div>Notification</div><div>Email</div><div>SMS</div><div>Push</div></div>
        <div data-bind="notifications">
          <template>
            <div class="row">
              <div>
                <div style="font-weight:500">{{label}}</div>
                <div class="section-sub">{{help}}</div>
              </div>
              <div><span class="toggle email-{{email}}"></span></div>
              <div><span class="toggle sms-{{sms}}"></span></div>
              <div><span class="toggle push-{{push}}"></span></div>
            </div>
          </template>
        </div>
      </section>

      <section class="section">
        <button class="btn btn-primary" data-comm-action="save:settings">Save changes</button>
        <button class="btn btn-secondary">Cancel</button>
      </section>
    </main>
  </div>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
