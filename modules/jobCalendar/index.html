<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .cell { background: var(--surface-2); padding: 8px; min-height: 80px; border-radius: 4px; }
.cal .cell .date { font-size: 11px; color: var(--ink-3); margin-bottom: 6px; }
.pill { display: inline-block; padding: 2px 6px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; margin-bottom: 4px; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Job Calendar</div></div>
  <section class="section">
    <div id="cal-host"></div>
  </section>
  <section class="section">
    <h3 class="section-title">Jobs</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Title</th><th>Customer</th><th>Date</th><th>Hours</th><th>Status</th></tr></thead>
      <tbody data-bind="jobs">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{title}}</td>
            <td>{{customer}}</td>
            <td>{{date|date}}</td>
            <td>{{startHour|num}}–{{endHour|num}}</td>
            <td><span class="tag {{status}}">{{status}}</span></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
