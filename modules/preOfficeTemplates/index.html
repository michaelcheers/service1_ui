<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Office Templates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Pre-Office Templates</div></div>
  <section class="section">
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th><th>Fields</th><th>Updated</th><th>Created by</th></tr></thead>
      <tbody data-bind="templates">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{name}}</td>
            <td>{{fields|num}}</td>
            <td>{{updated|date}}</td>
            <td>{{createdBy}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
