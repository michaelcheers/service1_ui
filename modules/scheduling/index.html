<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheduling</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.grid { display: grid; grid-template-columns: 100px repeat(10, 1fr); gap: 2px; }
.cell, .hd, .lane { background: var(--surface-2); padding: 6px 8px; font-size: 12px; }
.hd { background: var(--line); font-weight: 600; }
.lane { background: var(--line); font-weight: 600; }
.pill { padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Scheduling</div></div>

  <section class="section">
    <h3 class="section-title">Day grid</h3>
    <div id="grid-host"></div>
  </section>

  <section class="section">
    <h3 class="section-title">Crews</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th><th>Members</th></tr></thead>
      <tbody data-bind="crews">
        <template>
          <tr><td>{{id|num}}</td><td>{{name}}</td><td>{{members}}</td></tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">All jobs</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Title</th><th>Customer</th><th>Date</th><th>Hours</th><th>Crew</th><th>Status</th></tr></thead>
      <tbody data-bind="jobs">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{title}}</td>
            <td>{{customer}}</td>
            <td>{{date|date}}</td>
            <td>{{startHour|num}}–{{endHour|num}}</td>
            <td>{{crewId|num}}</td>
            <td><span class="tag {{status}}">{{status}}</span></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
