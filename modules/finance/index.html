<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Finance</div></div>

  <section class="section">
    <h3 class="section-title">P&amp;L (monthly)</h3>
    <table class="tbl">
      <thead><tr><th>Month</th><th style="text-align:right">Revenue</th><th style="text-align:right">Expenses</th><th style="text-align:right">Net</th></tr></thead>
      <tbody data-bind="pnl">
        <template>
          <tr>
            <td>{{month}}</td>
            <td style="text-align:right">{{revenue|usdint}}</td>
            <td style="text-align:right">{{expenses|usdint}}</td>
            <td style="text-align:right">{{net|usdint}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <div class="two-col">
    <section class="section">
      <h3 class="section-title">Receivables</h3>
      <table class="tbl">
        <thead><tr><th>Customer</th><th style="text-align:right">Amount</th><th>Aging</th></tr></thead>
        <tbody data-bind="receivables">
          <template>
            <tr>
              <td>{{customer}}</td>
              <td style="text-align:right">{{amount|usdint}}</td>
              <td>{{aging}}</td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>

    <section class="section">
      <h3 class="section-title">Payables</h3>
      <table class="tbl">
        <thead><tr><th>Vendor</th><th style="text-align:right">Amount</th><th>Due</th></tr></thead>
        <tbody data-bind="payables">
          <template>
            <tr>
              <td>{{vendor}}</td>
              <td style="text-align:right">{{amount|usdint}}</td>
              <td>{{due|date}}</td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>
  </div>

  <section class="section">
    <h3 class="section-title">Invoices</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Number</th><th>Customer</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
      <tbody data-bind="invoices">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{number}}</td>
            <td>{{customer}}</td>
            <td style="text-align:right">{{amount|usdint}}</td>
            <td><span class="tag {{status}}">{{status}}</span></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">Payments</h3>
    <table class="tbl">
      <thead><tr><th>Ref</th><th>Customer</th><th style="text-align:right">Amount</th><th>Date</th></tr></thead>
      <tbody data-bind="payments">
        <template>
          <tr>
            <td>{{ref}}</td>
            <td>{{customer}}</td>
            <td style="text-align:right">{{amount|usdint}}</td>
            <td>{{date|date}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
