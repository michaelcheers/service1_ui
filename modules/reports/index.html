<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.kpi-card { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.kpi-card .v { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; }
.spark { height: 36px; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Reports</div></div>
  <div class="cards" data-bind="reports">
    <template>
      <div class="kpi-card">
        <div class="section-sub">{{label}}</div>
        <div class="v">{{value|num}}</div>
        <div class="section-sub">{{id}}</div>
      </div>
    </template>
  </div>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
