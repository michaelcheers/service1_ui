<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Processes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.proc { border:1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 16px; }
.proc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
.step { display: grid; grid-template-columns: 24px 1fr 100px; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line); }
.step:first-child { border-top: 0; }
.step-n { font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Crew Processes</div></div>

  <section class="section">
    <h3 class="section-title">Active crews</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th></tr></thead>
      <tbody data-bind="crews">
        <template>
          <tr><td>{{id|num}}</td><td>{{name}}</td></tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">Processes</h3>
    <div id="processes-host"></div>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
