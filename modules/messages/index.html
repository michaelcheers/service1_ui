<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_system.css">
<style>
/* Simplified single full-width message list. The 3-column inbox (thread pane,
   composer, customer action sidebar) was removed — this view just shows the
   messages, their filer + status, and opens the related job on click. */
.msg-wrap { display:flex; flex-direction:column; height:100vh; }
.msg-col { background:#fff; display:flex; flex-direction:column; min-width:0; flex:1; }
.msg-head { padding:16px 18px; border-bottom:var(--hair); }
.msg-h1 { font-size:18px; font-weight:700; margin:0 0 10px; }
.msg-tabs { display:flex; gap:0; border-bottom:var(--hair); }
.msg-tab { padding:10px 12px; font-size:12px; font-weight:600; color:var(--ink-3); cursor:pointer; background:transparent; border:0; border-bottom:2px solid transparent; }
.msg-tab.active { color:var(--terra); border-bottom-color:var(--terra); }
.msg-filters { display:flex; gap:8px; padding:12px 14px; flex-wrap:wrap; background:var(--surface-2); border-bottom:var(--hair); }
.msg-filters select { padding:6px 10px; border:var(--hair); border-radius:5px; font-size:12px; background:#fff; }
.msg-filters input { flex:1; min-width:200px; padding:6px 10px; border:var(--hair); border-radius:5px; font-size:12px; }

.msg-list { flex:1; overflow-y:auto; }
.msg-item { display:flex; gap:10px; padding:14px 16px; border-bottom:var(--hair); align-items:center; cursor:default; }
.msg-item.navable { cursor:pointer; }
.msg-item.navable:hover { background:var(--surface-2); }
.msg-item.unread { font-weight:600; }
.msg-av { width:34px; height:34px; border-radius:999px; background:var(--terra); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
.msg-body { flex:1; min-width:0; }
.msg-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
.msg-name { font-size:13px; color:var(--ink); }
.msg-time { font-size:11px; color:var(--ink-3); }
.msg-subj { font-size:12.5px; color:var(--ink-2); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.msg-snip { font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.msg-tags { display:flex; gap:4px; margin-top:6px; }
.msg-chev { color:var(--ink-3); font-size:18px; flex-shrink:0; visibility:hidden; }
.msg-item.navable .msg-chev { visibility:visible; }

/* Channel + status badges. Neutral grey base so any status is styled, then a
   specific colour per real status (comms display buckets + call outcomes). */
.tag { display:inline-flex; align-items:center; gap:3px; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:600; background:#E5E7EB; color:#374151; }
.tag.email { background:#DBEAFE; color:#1E40AF; }
.tag.sms { background:#FEF3C7; color:#92400E; }
.tag.call { background:#D1FAE5; color:#065F46; }
.tag.sent { background:#E0E7FF; color:#3730A3; }
.tag.draft { background:#E5E7EB; color:#374151; }
.tag.delivered { background:#DBEAFE; color:#1E40AF; }
.tag.opened { background:#D1FAE5; color:#065F46; }
.tag.replied { background:#DCFCE7; color:#166534; }
.tag.failed { background:#FEE2E2; color:#B91C1C; }
.tag.answered { background:#D1FAE5; color:#065F46; }
.tag.no-answer { background:#FEF3C7; color:#92400E; }
.tag.voicemail { background:#E0E7FF; color:#3730A3; }
.tag.busy { background:#FEF3C7; color:#92400E; }
.tag.completed { background:#D1FAE5; color:#065F46; }

.msg-foot { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:var(--hair); font-size:12px; color:var(--ink-3); }
.msg-pager { display:flex; gap:6px; }
.msg-pager-btn { height:30px; padding:0 11px; border:var(--hair); border-radius:6px; font-size:12px; font-weight:600; background:#fff; color:var(--ink); cursor:pointer; }
.msg-pager-btn.primary { color:#fff; background:var(--terra); border-color:var(--terra); }
.msg-pager-btn:disabled { color:var(--ink-3); cursor:default; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_aesthetic.css">
</head>
<body>
<div class="app" data-screen-label="Messages"><main class="page" style="padding:0;">
    <div class="msg-wrap">
      <div class="msg-col">
        <div class="msg-head">
          <h1 class="msg-h1" data-bind-text="summary">Messages</h1>
          <div class="msg-tabs">
            <button data-messages-filter="all" class="msg-tab active">All</button>
            <button data-messages-filter="unread" class="msg-tab">Unread</button>
            <button data-messages-filter="email" class="msg-tab">Email</button>
            <button data-messages-filter="sms" class="msg-tab">SMS</button>
            <button data-messages-filter="calls" class="msg-tab">Calls</button>
          </div>
        </div>
        <div class="msg-filters">
          <select data-bind-options="statusOptions" data-msg-filter="status"><option value="">All statuses</option></select>
          <input type="text" data-msg-filter="search" placeholder="Search subject, customer, text…">
        </div>

        <div class="msg-list" data-bind="rows"><template><div class="msg-item {{cls}} {{navable}}" data-msg-url="{{navUrl}}"><div class="msg-av" style="background:{{avBg}};">{{avInitials}}</div><div class="msg-body"><div class="msg-top"><span class="msg-name">{{name}}</span><span class="msg-time">{{time}}</span></div><div class="msg-subj">{{subject}}</div><div class="msg-snip">{{snippet}}</div><div class="msg-tags"><span class="tag {{channelClass}}">{{channel}}</span><span class="tag {{statusClass}}">{{status}}</span></div></div><span class="msg-chev">›</span></div></template></div>

        <div class="msg-foot">
          <span>Showing <span data-bind-text="pagination.shown">0</span> of <span data-bind-text="pagination.total">0</span> messages</span>
          <div class="msg-pager" id="messagesPager"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/_log.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="../../core/standard-page.js"></script>
<script src="../../core/google-places.js"></script>
<script src="./module.js"></script>
</body>
</html>
