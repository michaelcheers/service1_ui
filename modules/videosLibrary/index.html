<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videos Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.video-card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.thumb { background: var(--surface-2); height: 120px; border-radius: 4px; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Videos Library</div></div>
  <div class="cards" data-bind="videos">
    <template>
      <div class="video-card">
        <div class="thumb"></div>
        <div style="font-weight:600">{{title}}</div>
        <div class="section-sub">{{category}} · {{duration|duration}}</div>
        <div class="section-sub">Uploaded {{uploaded|date}}</div>
      </div>
    </template>
  </div>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
