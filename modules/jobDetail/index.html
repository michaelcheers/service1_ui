<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.summary .cell { padding: 12px; background: var(--surface-2); border-radius: var(--r); }
.summary .cell .l { font-size: 11px; color: var(--ink-3); }
.summary .cell .v { font-size: 16px; font-weight: 600; margin-top: 4px; }
.timeline-item { display: grid; grid-template-columns: 140px 1fr 100px; padding: 8px 0; border-top: 1px solid var(--line); }
.timeline-item:first-child { border-top: 0; }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Job Detail · <span data-bind-text="job.number"></span></div></div>

  <div class="summary">
    <div class="cell"><div class="l">Customer</div><div class="v" data-bind-text="job.customer"></div></div>
    <div class="cell"><div class="l">Status</div><div class="v"><span class="tag in_progress" data-bind-text="job.status"></span></div></div>
    <div class="cell"><div class="l">Address</div><div class="v" data-bind-text="job.address"></div></div>
    <div class="cell"><div class="l">Value</div><div class="v" data-bind-text="job.value" data-fmt="usdint"></div></div>
  </div>

  <section class="section">
    <h3 class="section-title">Contact</h3>
    <div>Name: <strong data-bind-text="job.contact.name"></strong></div>
    <div>Email: <strong data-bind-text="job.contact.email"></strong></div>
    <div>Phone: <strong data-bind-text="job.contact.phone"></strong></div>
  </section>

  <section class="section">
    <h3 class="section-title">Invoices</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Number</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
      <tbody data-bind="invoices">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{number}}</td>
            <td style="text-align:right">{{amount|usdint}}</td>
            <td><span class="tag {{status}}">{{status}}</span></td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">Documents</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Name</th><th>Folder</th></tr></thead>
      <tbody data-bind="documents">
        <template>
          <tr><td>{{id|num}}</td><td>{{name}}</td><td>{{folder}}</td></tr>
        </template>
      </tbody>
    </table>
  </section>

  <section class="section">
    <h3 class="section-title">Activity</h3>
    <div data-bind="timeline">
      <template>
        <div class="timeline-item">
          <div class="section-sub">{{ts}}</div>
          <div>{{label}}</div>
          <div class="section-sub">{{by}}</div>
        </div>
      </template>
    </div>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
