<style>
.tasks-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.tasks-header-left { display: flex; align-items: center; gap: 16px; }
.view-toggle { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: var(--hair); border-radius: 8px; }
.view-toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; font-size: 12.5px; font-weight: 500;
  color: var(--ink-2); background: transparent; border: 0;
  border-radius: 5px; cursor: pointer; text-decoration: none;
}
.view-toggle-btn:hover { color: var(--ink); }
.view-toggle-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.06); font-weight: 600; }

.tasks-filters { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.tasks-filters select, .tasks-filters input {
  height: 34px; padding: 0 10px; font-size: 12.5px;
  border: var(--hair); border-radius: 8px; background: #fff; color: var(--ink); font-family: inherit;
}

/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kanban-col {
  background: var(--surface-2); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 540px;
}
.kanban-col-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
.kanban-col-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.kanban-col-dot { width: 8px; height: 8px; border-radius: 999px; }
.kanban-col-count {
  background: #fff; border: var(--hair);
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-3);
}
.kanban-col-body { flex: 1; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
.kanban-col-body.drag-over { background: var(--terra-soft); outline: 2px dashed var(--terra); outline-offset: -4px; border-radius: 6px; }
.task-card[draggable="true"] { cursor: grab; }
.task-card.dragging { opacity: 0.4; cursor: grabbing; }

.task-card {
  background: #fff; border: var(--hair); border-radius: 6px;
  padding: 10px 12px; cursor: grab;
  transition: box-shadow .12s, transform .12s;
}
.task-card:hover { box-shadow: 0 2px 8px rgba(15,23,42,.08); transform: translateY(-1px); }
.task-card-title { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 6px; line-height: 1.3; }
.task-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task-pill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 600;
}
.task-pill.pri-Urgent { background:#FEF2F2; color:#DC2626; }
.task-pill.pri-High   { background:#FFF7ED; color:#EA580C; }
.task-pill.pri-Medium { background:#FFFBEB; color:#D97706; }
.task-pill.pri-Low    { background:#F0FDF4; color:#16A34A; }
.task-pill.proj       { background: var(--surface-2); color: var(--ink-2); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-card-assignee { width: 22px; height: 22px; border-radius: 999px; background: var(--terra); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600; margin-left: auto; }
.task-card-due { font-size: 10.5px; color: var(--ink-3); }
.task-card-due.overdue { color: var(--bad); font-weight: 600; }

/* List view */
.tasks-list { display: none; }
.tasks-list.active { display: block; }
.kanban.hide { display: none; }

.tasks-table { width: 100%; border-collapse: collapse; background: #fff; border: var(--hair); border-radius: 8px; overflow: hidden; }
.tasks-table th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: var(--hair); text-align: left; background: var(--surface-2); }
.tasks-table td { padding: 12px 14px; font-size: 12.5px; border-bottom: 1px solid var(--line-2); }
.tasks-table tbody tr:last-child td { border-bottom: 0; }
.tasks-table tbody tr { cursor: pointer; }
.tasks-table tbody tr:hover td { background: var(--surface-2); }
.task-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600;
}
.task-status .dot { width: 8px; height: 8px; border-radius: 999px; }

/* Modal */
.tm-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.45); display:none; align-items:center; justify-content:center; z-index:1000; }
.tm-overlay.open { display:flex; }
.tm-modal { background:#fff; border-radius:12px; width:640px; max-width:96vw; max-height:92vh; overflow:auto; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
.tm-head { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:var(--hair); }
.tm-title { font-size:17px; font-weight:700; }
.tm-close { background:transparent; border:0; cursor:pointer; font-size:20px; color:var(--ink-3); }
.tm-body { padding:20px 22px; }
.tm-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
.tm-field { display:flex; flex-direction:column; gap:6px; }
.tm-field.full { grid-column:1/-1; }
.tm-label { font-size:12.5px; font-weight:600; color:var(--ink); }
.tm-label .req { color:var(--bad); }
.tm-input, .tm-select, .tm-textarea {
  width:100%; padding:9px 11px; border:var(--hair); border-radius:6px; font-size:13px; font-family:inherit; outline:none; background:#fff;
}
.tm-textarea { min-height:90px; resize:vertical; }
.tm-input:focus, .tm-select:focus, .tm-textarea:focus { border-color:var(--terra); box-shadow:0 0 0 3px var(--terra-soft); }
.tm-help { font-size:11.5px; color:var(--ink-3); }
.tm-actions { padding:14px 22px; border-top:var(--hair); display:flex; justify-content:flex-end; gap:8px; }
.tm-checkbox-row { display:flex; align-items:center; gap:8px; padding:8px 0; }
.tm-chip { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--surface-2); font-size:11px; font-weight:600; }
</style>

<!-- New Task Modal -->
<div class="tm-overlay" id="newTaskModal">

const STATUS_COLORS = { ToDo:'#6B7280', InProgress:'#2563EB', Review:'#D97706', Done:'#16A34A' };
const STATUS_LABEL  = { ToDo:'To Do', InProgress:'In Progress', Review:'Review', Done:'Done' };

// Read fresh on every render so host state-pushes land. The live backend POCO
// uses bucketed arrays (overdue/dueToday/thisWeek/completed) instead of a
// single `tasks` array with a `status` field, so when no `tasks` array is
// present we synthesize one from those buckets.
function getTasks() {
  const fx = (window.S1 && window.S1.fixtures && window.S1.fixtures["tasks"]) || null;
  const flat = fx && (Array.isArray(fx.tasks) ? fx.tasks : (Array.isArray(fx.Tasks) ? fx.Tasks : null));
  if (flat && flat.length) {
    return flat.map(t => Object.assign({}, t, {
      title:    t.title    || t.name      || '',
      project:  t.project  || t.tag       || t.deal || '',
      priority: t.priority || '',
      assignee: t.assignee || '',
      av:       t.av       || t.avInitials|| '',
      avc:      t.avc      || t.avBg      || 'var(--ink-3)',
      due:      t.due      || '',
      status:   t.status   || 'ToDo',
      tags:     Array.isArray(t.tags) ? t.tags : [],
      latestNote: t.latestNote || '',
      snoozedUntil: t.snoozedUntil || null,
      linkedKind: t.linkedKind || '',
      linkedId:   t.linkedId || null,
      linkedLabel: t.linkedLabel || ''
    }));
  }
  if (fx) {
    const buckets = [
      ['overdue',   'ToDo'],
      ['dueToday',  'ToDo'],
      ['thisWeek',  'InProgress'],
      ['completed', 'Done']
    ];
    const out = [];
    for (const [key, status] of buckets) {
      if (Array.isArray(fx[key])) {
        for (const t of fx[key]) {
          // Skip tasks without a real DB id — drag-update would target the
          // wrong row otherwise. Server must emit `id` on every bucket item.
          if (t.id == null) continue;
          out.push({
            id:       t.id,
            title:    t.name || t.title || '',
            project:  t.deal || t.tag || '',
            priority: t.priority || '',
            assignee: t.assignee || '',
            av:       t.avInitials || '',
            avc:      t.avBg || 'var(--ink-3)',
            due:      t.due || '',
            overdue:  key === 'overdue',
            status
          });
        }
      }
    }
    if (out.length) return out;
  }
  const IS_PROD = /(^|\.)service1\.app$/i.test(location.hostname);
  return IS_PROD ? [] : INLINE_TASKS;
}

function el(tag, opts, children) {
  const e = document.createElement(tag);
  if (opts) {
    if (opts.className) e.className = opts.className;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.cssText) e.style.cssText = opts.cssText;
    if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
    if (opts.title != null) e.title = opts.title;
  }
  if (children) for (const c of children) if (c != null) e.appendChild(c);
  return e;
}
function cardEl(t) {
  const card = el('div', { className: 'task-card', attrs: { 'data-id': t.id, draggable: 'true' } });

  meta.appendChild(el('span', { className: 'task-pill proj', text: t.project }));
  meta.appendChild(el('span', { className: 'task-card-due' + (t.overdue ? ' overdue' : ''), text: t.due }));
  meta.appendChild(el('span', { className: 'task-card-assignee', cssText: 'background:' + t.avc + ';', title: t.assignee, text: t.av }));
  card.appendChild(meta);
  return card;
}
function rowEl(t) {
  const tr = el('tr', { attrs: { 'data-id': t.id } });

  who.appendChild(document.createTextNode(t.assignee));

function applyFilters(tasks) {
  const p = document.getElementById('fProject').value;
  const a = document.getElementById('fAssignee').value;
  const pr = document.getElementById('fPriority').value;
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  return tasks.filter(t =>
    (!p  || t.project  === p) &&
    (!a  || t.assignee === a) &&
    (!pr || t.priority === pr) &&
    (!q  || t.title.toLowerCase().includes(q))
  );
}
function render() {
  const shown = applyFilters(getTasks());
  // Board
  ['ToDo','InProgress','Review','Done'].forEach(s => {
    const col = document.querySelector('.kanban-col-body[data-col="' + s + '"]');
    const items = shown.filter(t => t.status === s);
    col.replaceChildren();
    for (const t of items) col.appendChild(cardEl(t));
    col.previousElementSibling.querySelector('.kanban-col-count').textContent = items.length;
  });
  // List
  const listBody = document.getElementById('listBody');
  listBody.replaceChildren();
  if (shown.length) {
    for (const t of shown) listBody.appendChild(rowEl(t));
  } else {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.setAttribute('colspan', '6');
    td.style.cssText = 'text-align:center;padding:40px;color:var(--ink-3);';
    td.textContent = 'No tasks match.';
    tr.appendChild(td);
    listBody.appendChild(tr);
  }
}

    }
  });

// Drag-and-drop between kanban columns.
// Card drag carries the task id; column drop fires action:tasks.update-status
// to persist the new status, then re-renders from the host's pushed state.
(function () {
  const board = document.getElementById('boardView');
  let draggingId = null;
  board.addEventListener('dragstart', e => {
    const c = e.target.closest('.task-card[data-id]');
    if (!c) return;
    draggingId = +c.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(draggingId)); } catch {}
    c.classList.add('dragging');
  });
  board.addEventListener('dragend', e => {
    const c = e.target.closest('.task-card[data-id]');
    if (c) c.classList.remove('dragging');
    board.querySelectorAll('.kanban-col-body.drag-over').forEach(el => el.classList.remove('drag-over'));
    draggingId = null;
  });
  board.addEventListener('dragover', e => {
    const col = e.target.closest('.kanban-col-body[data-col]');
    if (!col) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!col.classList.contains('drag-over')) {
      board.querySelectorAll('.kanban-col-body.drag-over').forEach(el => el.classList.remove('drag-over'));
      col.classList.add('drag-over');
    }
  });
  board.addEventListener('dragleave', e => {
    const col = e.target.closest('.kanban-col-body[data-col]');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });
  board.addEventListener('drop', async e => {
    const col = e.target.closest('.kanban-col-body[data-col]');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    const id = draggingId || (e.dataTransfer && +e.dataTransfer.getData('text/plain'));
    const newStatus = col.dataset.col;
    if (!id || !newStatus) return;
    const tasks = getTasks();
    const t = tasks.find(x => x.id === id);
    if (!t || t.status === newStatus) return;
    // Optimistic local update so the card moves immediately; host will re-push
    // authoritative state after the RPC resolves.
    t.status = newStatus;
    render();
    try {
      await window.S1.comm.action('tasks.update-status', { id: id, status: newStatus });
    } catch (err) {
      console.warn('[tasks] drag persist failed:', err);
      // Revert by re-rendering from the un-mutated source on next state push;
      // if no push arrives (offline / RPC dead), the optimistic move stays
      // visible until the user refreshes.
    }
  });
})();

// Re-render when the host pushes fresh state.
if (window.S1 && window.S1.bus && typeof window.S1.bus.on === 'function') {
  window.S1.bus.on('state:replaced', render);
}

// ──────────────── Tag chip widget ────────────────
const tagsState = [];
function renderTags() {
  const box = document.getElementById('tagsBox');
  const input = document.getElementById('tagInput');
  // Remove existing chips, keep the input
  Array.from(box.querySelectorAll('.tm-tag-chip')).forEach(c => c.remove());
  tagsState.forEach(name => {
    const chip = el('span', { className: 'tm-chip tm-tag-chip', cssText: 'display:inline-flex;align-items:center;gap:4px;' });
    chip.appendChild(document.createTextNode(name));
    const x = el('span', { cssText: 'cursor:pointer;color:#6b7280;font-weight:700;margin-left:2px;', text: '✕' });
    x.addEventListener('click', () => {
      const i = tagsState.indexOf(name);
      if (i >= 0) tagsState.splice(i, 1);
      renderTags();
    });
    chip.appendChild(x);
    box.insertBefore(chip, input);
  });
  document.getElementById('tagsHidden').value = JSON.stringify(tagsState);
}
document.getElementById('tagInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim().slice(0, 32);
    if (v && !tagsState.some(x => x.toLowerCase() === v.toLowerCase())) {
      tagsState.push(v);
      renderTags();
    }
    e.target.value = '';
  } else if (e.key === 'Backspace' && !e.target.value && tagsState.length) {
    tagsState.pop();
    renderTags();
  }
});

  renderTags();

  document.getElementById('linkedPicked').style.display = 'none';

}

// ──────────────── Linked-entity picker ────────────────
const linkedKindSel = document.getElementById('linkedKind');
const linkedSearchInp = document.getElementById('linkedSearch');
const linkedPickerField = document.getElementById('linkedPickerField');
const linkedKindLabel = document.getElementById('linkedKindLabel');
const linkedIdHidden = document.getElementById('linkedIdHidden');
const linkedResults = document.getElementById('linkedResults');
const linkedPicked = document.getElementById('linkedPicked');

linkedKindSel.addEventListener('change', () => {
  const k = linkedKindSel.value;
  linkedIdHidden.value = '';
  linkedPicked.style.display = 'none';
  linkedPicked.replaceChildren();
  linkedResults.style.display = 'none';
  linkedResults.replaceChildren();
  if (!k) {
    linkedPickerField.style.display = 'none';
    return;
  }
  linkedPickerField.style.display = '';
  linkedKindLabel.textContent = k;
  linkedSearchInp.value = '';
  linkedSearchInp.focus();
});

let linkedSearchTimer = null;
linkedSearchInp.addEventListener('input', () => {
  if (linkedSearchTimer) clearTimeout(linkedSearchTimer);
  const q = linkedSearchInp.value.trim();
  if (!q) { linkedResults.style.display = 'none'; linkedResults.replaceChildren(); return; }
  linkedSearchTimer = setTimeout(async () => {
    try {
      const r = await window.S1.comm.action('tasks.search-linked', { kind: linkedKindSel.value, q });
      linkedResults.replaceChildren();
      const rows = (r && r.results) || [];
      if (!rows.length) {
        const empty = el('div', { cssText: 'padding:8px 10px;color:var(--ink-3);font-size:12px;', text: 'No results.' });
        linkedResults.appendChild(empty);
      } else {
        rows.forEach(row => {
          const item = el('div', { cssText: 'padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;cursor:pointer;' });
          const main = el('b', { text: row.label || '' });
          item.appendChild(main);
          if (row.sub) {
            item.appendChild(document.createTextNode(' · '));
            item.appendChild(document.createTextNode(row.sub));
          }
          item.addEventListener('mouseenter', () => item.style.background = '#f9fafb');
          item.addEventListener('mouseleave', () => item.style.background = '');
          item.addEventListener('click', () => {
            linkedIdHidden.value = row.id;
            const chip = el('span', { className: 'tm-chip', cssText: 'display:inline-flex;align-items:center;gap:4px;' });
            chip.appendChild(document.createTextNode((row.label || '') + (row.sub ? ' · ' + row.sub : '')));
            const x = el('span', { cssText: 'cursor:pointer;color:#6b7280;font-weight:700;', text: '✕' });
            x.addEventListener('click', () => {
              linkedIdHidden.value = '';
              linkedPicked.replaceChildren();
              linkedPicked.style.display = 'none';
              linkedSearchInp.style.display = '';
            });
            chip.appendChild(x);
            linkedPicked.replaceChildren(chip);
            linkedPicked.style.display = '';
            linkedSearchInp.style.display = 'none';
            linkedResults.style.display = 'none';
            linkedResults.replaceChildren();
          });
          linkedResults.appendChild(item);
        });
      }
      linkedResults.style.display = '';
    } catch (e) {
      console.warn('[tasks] search-linked failed:', e);
    }
  }, 200);
});
</script>
