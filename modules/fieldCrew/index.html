<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Crew</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/module.css">
<style>
.crew-card { border:1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.crew-head { display:flex; align-items:center; justify-content:space-between; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: 6px; }
.in { background: var(--ok); } .out { background: var(--ink-4); }
</style>
</head><body>
<div class="wrap">
  <div class="page-bar"><div class="page-title">Field Crew</div></div>

  <section class="section">
    <h3 class="section-title">Crews</h3>
    <div class="cards" data-bind="crews">
      <template>
        <div class="crew-card">
          <div class="crew-head">
            <strong>{{name}}</strong>
            <span class="section-sub"><span class="dot in"></span>last ping {{lastPing}}</span>
          </div>
          <div class="section-sub">Members: {{members}}</div>
          <div class="section-sub">Location: {{location}}</div>
          <div class="section-sub">Current job: {{currentJobId|num}}</div>
        </div>
      </template>
    </div>
  </section>

  <section class="section">
    <h3 class="section-title">Active jobs</h3>
    <table class="tbl">
      <thead><tr><th>#</th><th>Customer</th><th>Status</th><th>Crew</th></tr></thead>
      <tbody data-bind="jobs">
        <template>
          <tr>
            <td>{{id|num}}</td>
            <td>{{customer}}</td>
            <td><span class="tag {{status}}">{{status}}</span></td>
            <td>{{crewId|num}}</td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>
</div>
<script src="../../core/event-bus.js"></script>
<script src="../../core/state-store.js"></script>
<script src="../../core/schema.js"></script>
<script src="../../core/fixtures.js"></script>
<script src="../../core/communication.mock.js"></script>
<script src="../../core/communication.api.js"></script>
<script src="../../core/communication.js"></script>
<script src="../../core/render.js"></script>
<script src="./module.js"></script>
</body></html>
